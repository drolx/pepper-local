[project]
name = "pepper-sync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Godwin peter .O", email = "me@godwin.dev" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.118.0",
    "pydantic>=2.12.0",
    # "pyyaml>=6.0.3",
    "tortoise-orm>=0.25.1",
    "uuid6>=2025.0.1",
    "uvicorn>=0.37.0",
]

[project.scripts]
pepper = "pepper:app"
pepper-cli = "pepper.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
