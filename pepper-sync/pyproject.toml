[project]
name = "pepper-sync"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Godwin peter .O", email = "me@godwin.dev" }]
requires-python = ">=3.10"
dependencies = [
    "aerich[toml]>=0.9.2",
    "fastapi>=0.118.0",
    "fastapi-crons>=2.0.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "tortoise-orm>=0.25.1",
    "uuid6>=2025.0.1",
    "uvicorn>=0.37.0",
]

[project.scripts]
pepper = "pepper.server:app"
pepper-cli = "pepper.main:cli"

[build-system]
requires = ["setuptools>=61.0", "pytest"]
build-backend = "setuptools.build_meta"

[tool.aerich]
tortoise_orm = "pepper.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
