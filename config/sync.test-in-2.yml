name: 'ingest-two'
persist: false
type: traccar
direction: in # in | out
interval: "* * * * *"
timeout: 10 # Seconds
address: 'https://demo.traccar.org'
auth:
  type: token # Basic | Token | Form
  token_key: 'Authorization' # Optional
  token_type: 'bearer' # Optional
  token: 'AUTH_TOKEN_ONE' # Optional | FROM: ENV_VAR
  # username: '' # Optional | FROM: ENV_VAR
  # password: '' # Optional | FROM: ENV_VAR
headers: # Optional
  'content-type': 'application/json'
