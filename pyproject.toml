[project]
name = "pepper-local"
description = "A simple utility application for merging telematics location data"
license = "MIT"
version = "0.2"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "drolx Labs", email = "dev@drolx.com" }]
keywords = ["Jobs", "Tasks", "Tool", "Utility"]
urls = { Homepage = "https://github.com/drolx/pepper-local" }

dependencies = [
    "cachetools>=6.2.0",
    "pepper-app",
    "pepper-sync",
]

[tool.uv.sources]
pepper-app = { workspace = true }
pepper-sync = { workspace = true }

[tool.uv.workspace]
members = ["pepper-app", "pepper-sync"]

[tool.aerich]
tortoise_orm = "pepper.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./pepper-sync/src"
